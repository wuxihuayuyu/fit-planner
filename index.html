<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit &amp; Fuel · 健身与营养规划 / Training &amp; Nutrition Planner</title>
<style>
  :root {
    --bg: #0e1412;
    --panel: #151d1a;
    --panel-2: #1c2723;
    --line: #293632;
    --text: #e4ece8;
    --muted: #8ea29b;
    --accent: #7fd8a4;
    --accent-ink: #0b1310;
    --warn: #f0c35a;
    --danger: #ff8170;
    --info: #86c5ff;
    --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.65;
  }
  button, input, select { font: inherit; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- 侧栏表单 ---------- */
  aside.side {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 20px 28px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  .brand .mark { color: var(--accent); }
  .lang {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .lang:hover { border-color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 18px; font-size: 13px; }

  .group { margin-bottom: 14px; }
  .group h3 {
    margin: 0 0 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .f input, .f select {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    outline: none;
    width: 100%;
    transition: border-color .2s;
  }
  .f input:focus, .f select:focus { border-color: var(--accent); }
  .f input::placeholder { color: #5b6b65; }
  .full { grid-column: 1 / -1; }
  .err { color: var(--danger); font-size: 12px; min-height: 18px; margin-top: 6px; }
  .fine { color: var(--muted); font-size: 11px; margin-top: 16px; line-height: 1.6; }

  /* ---------- 结果区 ---------- */
  main.out { padding: 26px 30px 60px; min-width: 0; }
  .hero {
    background:
      linear-gradient(120deg, rgba(127,216,164,.10), transparent 55%),
      var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .hero h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .hero p { margin: 0; color: var(--muted); }
  .hero .pill {
    display: inline-block; margin-top: 10px; font-family: var(--mono); font-size: 11px;
    padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    margin-right: 6px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .stat .v { font-family: var(--mono); font-size: 20px; margin-top: 2px; white-space: nowrap; }
  .stat .v small { font-size: 11px; color: var(--muted); margin-left: 3px; white-space: nowrap; }
  .stat .d { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .warns { display: grid; gap: 8px; margin: 14px 0; }
  .warn {
    border-radius: 10px;
    padding: 10px 14px;
    border: 1px solid;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .warn b { white-space: nowrap; font-weight: 700; }
  .warn.danger { border-color: rgba(255,129,112,.5); background: rgba(255,129,112,.08); color: #ffc2b8; }
  .warn.warn-lv { border-color: rgba(240,195,90,.5); background: rgba(240,195,90,.07); color: #f6e0a6; }
  .warn.info { border-color: rgba(134,197,255,.4); background: rgba(134,197,255,.06); color: #cfe6ff; }

  section.block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 16px;
  }
  section.block > h2 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  section.block > h2 .no { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 500; }
  section.block > .lede { color: var(--muted); margin: 0 0 14px; font-size: 13px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 14px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
  }
  .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  .week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
  }
  .day {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 10px 12px;
    min-height: 120px;
  }
  .day .dn { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .day .dw { font-weight: 700; font-size: 13px; margin: 2px 0 8px; color: var(--accent); }
  .day.rest .dw { color: var(--muted); font-weight: 500; }
  .day ul { list-style: none; padding: 0; margin: 0; }
  .day li { font-size: 12px; padding: 4px 0; border-top: 1px dashed var(--line); }
  .day li .sr { font-family: var(--mono); color: var(--muted); float: right; font-size: 11px; }
  .day li .cue { display: block; color: var(--muted); font-size: 11px; }
  .day .cardio { font-size: 11px; color: var(--info); margin-top: 6px; }

  .list-note { font-size: 13px; color: #c3cdc9; margin: 12px 0 0; }
  .list-note li { margin: 4px 0; }
  ul.tips { margin: 6px 0 0; padding-left: 18px; color: #c3cdc9; font-size: 13px; }
  ul.tips li { margin: 4px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .05em; }
  td .g { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  td.num { font-family: var(--mono); white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .meal-note { color: var(--muted); font-size: 11px; }
  .rot td:first-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; }

  .foot { color: var(--muted); font-size: 11px; margin-top: 22px; line-height: 1.7; }

  @media (max-width: 1100px) {
    .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside.side { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    main.out { padding: 18px 16px 50px; }
  }
  @media (max-width: 560px) {
    .week { grid-template-columns: 1fr 1fr; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <h1><span class="mark">◆</span> <span data-i18n="title"></span></h1>
      <button class="lang" id="langBtn" type="button"></button>
    </div>
    <p class="sub" data-i18n="subtitle"></p>

    <form id="form" autocomplete="off">
      <div class="group">
        <h3 data-i18n="g_body"></h3>
        <div class="row2">
          <label class="f"><span data-i18n="sex"></span><select id="f_sex"></select></label>
          <label class="f"><span data-i18n="age"></span><input id="f_age" type="number" min="14" max="90" step="1" value="22"></label>
          <label class="f"><span data-i18n="height"></span><input id="f_height" type="number" min="120" max="230" step="0.5" value="175"></label>
          <label class="f"><span data-i18n="weight"></span><input id="f_weight" type="number" min="30" max="250" step="0.1" value="70"></label>
          <label class="f full"><span data-i18n="bf"></span><input id="f_bf" type="number" min="3" max="60" step="0.1" data-i18n-ph="bf_ph"></label>
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="g_status"></h3>
        <div class="row2">
          <label class="f full"><span data-i18n="exp"></span><select id="f_exp"></select></label>
          <label class="f"><span data-i18n="days"></span><input id="f_days" type="number" min="2" max="6" step="1" value="3"></label>
          <label class="f"><span data-i18n="target_w"></span><input id="f_target" type="number" min="30" max="250" step="0.1" data-i18n-ph="target_ph"></label>
          <label class="f full"><span data-i18n="life"></span><select id="f_life"></select></label>
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="g_goal"></h3>
        <label class="f"><span data-i18n="goal"></span><select id="f_goal"></select></label>
      </div>
    </form>
    <p class="fine" data-i18n="fine"></p>
  </aside>

  <main class="out" id="out"></main>
</div>

 * ===================================================================== */

             tip: { zh: "中等次数、较高组次的腿部训练(弓步、登阶、腿弯举),配合轻度热量缺口,让大腿线条更匀称。", en: "Mid-to-high rep leg work (lunges, step-ups, leg curls) with a small deficit gives even, shapely thighs." }, extra: ["step_up","leg_curl"] }
};

const DAYS_DEFAULT = { none: 3, beg: 3, mid: 4, adv: 5 };
const DEF = { f_sex: "m", f_exp: "beg", f_life: "student", f_goal: "lean" };

/* =====================================================================
 *  工具函数
 * ===================================================================== */
let lang = (navigator.language || "zh").toLowerCase().startsWith("en") ? "en" : "zh";
let week = 1;

const $ = (s) => document.querySelector(s);
const tr = (k, vars) => {
  let s = I18N[lang][k];
  if (s === undefined) s = I18N.zh[k];
  if (typeof s !== "string") return s;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replaceAll("{" + a + "}", b);
  return s;
};
const L = (o) => (o && (o[lang] !== undefined ? o[lang] : o.zh)) || "";
const r0 = (x) => Math.round(x);
const r1 = (x) => Math.round(x * 10) / 10;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* =====================================================================
 *  计算引擎
 * ===================================================================== */
function bmiCategory(bmi) {
  if (bmi < 18.5) return tr("bmi_low");
  if (bmi < 24) return tr("bmi_normal");
  if (bmi < 28) return tr("bmi_over");
  return tr("bmi_obese");
}

function computePlan(input) {
  const { sex, age, height, weight, bf, exp, life, goal, target, days } = input;
  const h = height / 100;
  const bmi = weight / (h * h);
  const warnings = [];
  const push = (key, vars) => {
    const lv = I18N.zh[key].lv;
    let text = I18N[lang][key].text;
    if (vars) for (const [a, b] of Object.entries(vars)) text = text.replaceAll("{" + a + "}", b);
    warnings.push({ lv, text });
  };

  /* 1. 基础代谢:有体脂率时用 Katch-McArdle(更贴近瘦体重),否则用 Mifflin-St Jeor */
  let bmr, formula;
  if (bf) {
    const lbm = weight * (1 - bf / 100);
    bmr = 370 + 21.6 * lbm;
    formula = "katch";
  } else {
    bmr = 10 * weight + 6.25 * height - 5 * age + (sex === "m" ? 5 : -161);
    formula = "mifflin";
  }

  /* 2. 活动系数 = 生活方式基础 + 每周训练天数 */
  const mult = LIFE[life].mult + days * 0.02;
  const tdee = bmr * mult;

  /* 3. 目标热量 */
  const G = GOALS[goal];
  const rawTarget = tdee * (1 + G.delta);
  const floor = sex === "m" ? 1500 : 1200;
  let kcal = rawTarget;
  if (kcal < floor) {
    push("w_floor", { raw: r0(rawTarget), floor });
    kcal = floor;
  }

  /* 4. 宏量营养素 */
  const protein = weight * G.pg;
  const fat = weight * 0.8;
  let carbs = (kcal - protein * 4 - fat * 9) / 4;
  carbs = Math.max(carbs, 50);

  /* 5. 每周体重变化与预计时间 */
  const weeklyKg = (kcal - tdee) * 7 / 7700; // 约 7700 kcal ≈ 1 kg 体脂
  const weeklyPct = Math.abs(weeklyKg) / weight * 100;
  let eta = null;
  if (target && target < weight && weeklyKg < 0) {
    eta = (weight - target) / Math.abs(weeklyKg);
  }
  if (target && target > weight && weeklyKg > 0) {
    eta = (target - weight) / weeklyKg;
  }

  /* 6. 健康风险规则 */
  if (bmi < 18.5) push("w_bmi_low", { bmi: r1(bmi) });
  if (target) {
    const tbmi = target / (h * h);
    if (tbmi < 18.5) push("w_target_low", { bmi: r1(tbmi) });
  }
  if (weeklyKg < 0 && weeklyPct > 1) push("w_fast", { rate: r1(weeklyPct) });
  if (bf && ((sex === "m" && bf < 10) || (sex === "f" && bf < 18))) push("w_bf_low", { bf: r1(bf) });
  if ((goal === "lose" || goal === "tone") && bmi < 20) push("w_thin_lose");
  if (bmi < 18.5 && (goal === "lean" || goal === "glutes" || goal === "thick")) push("w_thin_gain");
  if (age < 18) push("w_minor");
  if (age >= 60) push("w_senior");

  return {
    bmi, bmr, tdee, mult, formula, kcal, rawTarget, floor, protein, fat, carbs,
    weeklyKg, weeklyPct, eta, G, warnings, goal, life, exp, days, sex, weight, height, age
  };
}

/* =====================================================================
 *  训练计划
 * ===================================================================== */
function buildWorkouts(plan) {
  const { exp, days, goal } = plan;
  const G = GOALS[goal];
  const templates = SPLITS[exp];
  const out = [];
  for (let i = 0; i < days; i++) {
    let ids = templates[i % templates.length].slice();
    // 新手把复杂动作换成更容易掌握的版本
    if (exp === "none") ids = ids.map(x => ({ squat: "goblet", bench: "pushup", hip_thrust: "glute_bridge", deadlift: "rdl" }[x] || x));
    const isLower = ids.some(x => LOWER.includes(x));
    // 目标附加动作:只加在下肢日,避免重复
    if (isLower && G.extra.length) {
      for (const x of G.extra) if (!ids.includes(x)) ids.splice(ids.length - 1, 0, x);
    }
    // 限制单次动作数量
    ids = ids.slice(0, 6);
    out.push({ ids, lower: isLower });
  }
  return out;
}

function trainingWeekLayout(days) {
  // 把训练日尽量均匀地散布在一周的 7 天中
  const slots = new Array(7).fill(null);
  for (let i = 0; i < days; i++) slots[Math.floor(i * 7 / days)] = i;
  return slots;
}

function setsReps(plan, w, id) {
  const base = plan.exp === "none" ? 2 : 3;
  let sets;
  if (w === 4) sets = Math.max(2, base - 1);
  else sets = base + (w >= 2 && plan.exp !== "none" ? 1 : 0);
  const G = plan.G;
  const reps = id === "plank" ? { zh: "30–60 秒", en: "30–60 s" } : { zh: G.reps, en: G.reps };
  return { sets, reps: L(reps) };
}

/* =====================================================================
 *  饮食规划:按生活方式生成三餐 + 加餐,蛋白质欠账顺延到后面的餐次
 * ===================================================================== */
function buildDay(plan, dayIdx) {
  const life = LIFE[plan.life];
  let pLeft = plan.protein;
  let shareLeft = 1;
  const out = [];
  for (const s of life.slots) {
    const kTarget = plan.kcal * s.share;
    const pTarget = pLeft * (s.share / shareLeft);
    shareLeft -= s.share;

    const pid = s.p[dayIdx % s.p.length];
    const cid = s.c[dayIdx % s.c.length];
    const pf = FOODS[pid];
    const cf = FOODS[cid];

    const items = [];
    let k = 0, p = 0, c = 0, f = 0;

    const pg = clamp(pTarget * 100 / pf.p, 40, pf.max);
    items.push({ name: pf.name, g: r0(pg) });
    k += pg * pf.k / 100; p += pg * pf.p / 100; c += pg * pf.c / 100; f += pg * pf.f / 100;

    if (s.veg) {
      items.push({ name: VEG.name, g: VEG.g });
      k += VEG.k; p += VEG.p;
    }
    if (s.oil) {
      items.push({ name: OIL.name, g: OIL.g });
      k += OIL.k; f += OIL.g;
    }

    const rem = Math.max(0, kTarget - k);
    const cg = clamp(rem * 100 / cf.k, 0, cf.max);
    items.push({ name: cf.name, g: r0(cg) });
    k += cg * cf.k / 100; p += cg * cf.p / 100; c += cg * cf.c / 100; f += cg * cf.f / 100;

    // 主食到达单餐上限后,用坚果补足剩余热量(单次不超过 30 g)
    const rem2 = kTarget - k;
    if (rem2 > 30) {
      const nut = FOODS.almonds;
      const ng = clamp(rem2 * 100 / nut.k, 0, nut.max);
      items.push({ name: nut.name, g: r0(ng) });
      k += ng * nut.k / 100; p += ng * nut.p / 100; c += ng * nut.c / 100; f += ng * nut.f / 100;
    }

    pLeft -= p;
    out.push({ key: s.key, note: s.note, items, kcal: k, p, c, f });
  }
  return out;
}

/* =====================================================================
 *  渲染
 * ===================================================================== */
function fillSelects() {
  const OPT = {
    f_sex:  [["m", { zh: "男", en: "Male" }], ["f", { zh: "女", en: "Female" }]],
    f_exp:  Object.entries(EXP).map(([k, v]) => [k, v.name]),
    f_life: Object.entries(LIFE).map(([k, v]) => [k, v.name]),
    f_goal: Object.entries(GOALS).map(([k, v]) => [k, v.name])
  };
  for (const [id, list] of Object.entries(OPT)) {
    const el = $("#" + id);
    const cur = el.value || DEF[id];
    el.innerHTML = list.map(([v, n]) => `<option value="${v}">${L(n)}</option>`).join("");
    el.value = cur;
  }
}

function applyStaticI18n() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = lang === "zh"
    ? "Fit & Fuel · 健身与营养规划"
    : "Fit & Fuel · Training & Nutrition Planner";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = tr(el.dataset.i18nPh); });
  $("#langBtn").textContent = tr("lang_btn");
  document.querySelector(".fine").textContent = tr("fine");
  document.querySelector(".sub").textContent = tr("subtitle");
  fillSelects();
}

function readInput() {
  const v = (id) => $("#" + id).value;
  const num = (id) => { const s = v(id).trim(); return s === "" ? null : Number(s); };
  const o = {
    sex: v("f_sex"), age: num("f_age"), height: num("f_height"), weight: num("f_weight"),
    bf: num("f_bf"), exp: v("f_exp"), life: v("f_life"), goal: v("f_goal"),
    target: num("f_target"), days: num("f_days")
  };
  const inRange = (x, a, b) => x !== null && !Number.isNaN(x) && x >= a && x <= b;
  const requiredOk = inRange(o.age, 14, 90) && inRange(o.height, 120, 230) && inRange(o.weight, 30, 250) && inRange(o.days, 2, 6);
  if (!requiredOk) return { error: "required" };
  const optionalOk = (o.bf === null || inRange(o.bf, 3, 60)) && (o.target === null || inRange(o.target, 30, 250));
  if (!optionalOk) return { error: "optional" };
  return o;
}

function render() {
  const out = $("#out");
  const input = readInput();
  if (input.error) {
    out.innerHTML = `<div class="hero"><h2>${tr("title")}</h2><p>${tr(input.error === "required" ? "err_required" : "err_optional")}</p></div>`;
    return;
  }
  const plan = computePlan(input);
  const workouts = buildWorkouts(plan);
  const layout = trainingWeekLayout(plan.days);
  const G = plan.G;
  const bmiLabel = bmiCategory(plan.bmi);

  /* ---- 概览卡片 ---- */
  const changeSign = plan.weeklyKg < -0.005 ? "−" : plan.weeklyKg > 0.005 ? "+" : "±";
  const changeTxt = `${changeSign}${Math.abs(plan.weeklyKg).toFixed(2)} kg`;
  const cardioText = I18N[lang].cardio_detail[G.cardio];
  const stats = `
    <div class="stats">
      <div class="stat"><div class="k">${tr("s_bmi")}</div><div class="v">${r1(plan.bmi)}</div><div class="d">${bmiLabel}</div></div>
      <div class="stat"><div class="k">${tr("s_bmr")}</div><div class="v">${r0(plan.bmr)}<small>${tr("kcal_unit")}</small></div><div class="d">${plan.formula === "katch" ? tr("formula_katch") : tr("formula_mifflin")}</div></div>
      <div class="stat"><div class="k">${tr("s_tdee")}</div><div class="v">${r0(plan.tdee)}<small>${tr("kcal_unit")}</small></div><div class="d">× ${plan.mult.toFixed(2)}</div></div>
      <div class="stat"><div class="k">${tr("s_kcal")}</div><div class="v">${r0(plan.kcal)}<small>${tr("kcal_unit")}</small></div><div class="d">${L(G.name)}</div></div>
      <div class="stat"><div class="k">${tr("s_protein")}</div><div class="v">${r0(plan.protein)}<small>g</small></div><div class="d">${plan.G.pg} g/kg</div></div>
      <div class="stat"><div class="k">${tr("s_carb")}</div><div class="v">${r0(plan.carbs)}<small>g</small></div><div class="d">${tr("s_fat")} ${r0(plan.fat)} g</div></div>
      <div class="stat"><div class="k">${tr("s_change")}</div><div class="v">${changeTxt}<small>${tr("per_week")}</small></div><div class="d">${r1(plan.weeklyPct)}% ${tr("per_week")}</div></div>
      ${plan.eta !== null ? `<div class="stat"><div class="k">${tr("s_eta")}</div><div class="v">${r0(plan.eta)}<small>${tr("weeks_unit")}</small></div><div class="d">${tr("est_note")}</div></div>` : ""}
    </div>`;

  /* ---- 健康提示 ---- */
  const warnHtml = plan.warnings.length
    ? `<div class="warns">${plan.warnings.map(w => `<div class="warn ${w.lv === "danger" ? "danger" : w.lv === "warn" ? "warn-lv" : "info"}"><b>${w.lv === "danger" ? "!!" : w.lv === "warn" ? "!" : "i"}</b><span>${w.text}</span></div>`).join("")}</div>`
    : `<div class="warns"><div class="warn info"><b>✓</b><span>${tr("no_warn")}</span></div></div>`;

  /* ---- 训练计划 ---- */
  const weekTabs = [1, 2, 3, 4].map(w => `<button class="tab${w === week ? " on" : ""}" data-week="${w}" type="button">${tr("week_n", { n: w })}</button>`).join("");
  const dayCells = layout.map((wi, di) => {
    const dn = tr("day_names")[di];
    if (wi === null) {
      return `<div class="day rest"><div class="dn">${dn}</div><div class="dw">${tr("rest")}</div></div>`;
    }
    const wk = workouts[wi];
    const lines = wk.ids.map(id => {
      const sr = setsReps(plan, week, id);
      return `<li><span class="sr">${sr.sets}×${sr.reps}</span>${L(EX[id].name)}<span class="cue">${L(EX[id].cue)}</span></li>`;
    }).join("");
    const titles = plan.exp === "adv"
      ? [["Push","推"],["Pull","拉"],["Legs","腿"],["Upper","上肢"],["Lower","下肢"]][wi % 5]
      : plan.exp === "mid"
        ? [["Upper","上肢"],["Lower","下肢"]][wi % 2]
        : [["Full body A","全身 A"],["Full body B","全身 B"]][wi % 2];
    return `<div class="day"><div class="dn">${dn}</div><div class="dw">${lang === "zh" ? titles[1] : titles[0]}</div><ul>${lines}</ul></div>`;
  }).join("");

  const progression = `<ul class="tips">${tr("week_desc").map((d, i) => `<li><b>${tr("week_n", { n: i + 1 })}</b>:${d}</li>`).join("")}</ul>`;

  const cardioNote = `<ul class="tips"><li>${tr("cardio_label")}:${cardioText}</li><li>${tr("deload_note")}</li></ul>`;

  /* ---- 饮食 ---- */
  const day0 = buildDay(plan, 0);
  const slotName = (k) => tr("slot_" + k);
  const sampleRows = day0.map(s => `
    <tr>
      <td><b>${slotName(s.key)}</b><div class="meal-note">${L(s.note)}</div></td>
      <td>${s.items.map(it => `${L(it.name)} <span class="g">${it.g}g</span>`).join("<br>")}</td>
      <td class="num">${r0(s.kcal)}<br><span class="g">${tr("s_protein")} ${r0(s.p)}g</span></td>
    </tr>`).join("");
  const dayKcal = day0.reduce((a, s) => a + s.kcal, 0);
  const dayP = day0.reduce((a, s) => a + s.p, 0);
  const sampleTable = `
    <div class="table-wrap"><table>
      <thead><tr><th>${lang === "zh" ? "餐次" : "Meal"}</th><th>${lang === "zh" ? "食物与克重(生重/熟重以标注为准)" : "Foods and weights (as labelled)"}</th><th>${lang === "zh" ? "热量 / 蛋白" : "kcal / protein"}</th></tr></thead>
      <tbody>${sampleRows}
        <tr><td><b>${tr("day_total")}</b></td><td></td><td class="num"><b>${r0(dayKcal)}</b> / ${r0(dayP)}g<br><span class="g">${tr("total")} · ${tr("s_kcal")} ${r0(plan.kcal)}</span></td></tr>
      </tbody>
    </table></div>`;

  const rotRows = [0,1,2,3,4,5,6].map(d => {
    const day = buildDay(plan, d);
    const nm = (s) => s.items.filter(i => i.name !== VEG.name && i.name !== OIL.name).map(i => L(i.name)).join(" + ");
    return `<tr><td>${tr("day_names")[d]}</td><td>${nm(day[0])}</td><td>${nm(day[1])}</td><td>${nm(day[2])}</td><td>${nm(day[3])}</td><td class="num">${r0(day.reduce((a, s) => a + s.kcal, 0))}</td></tr>`;
  }).join("");
  const rotTable = `
    <div class="table-wrap"><table class="rot">
      <thead><tr><th></th><th>${tr("slot_breakfast")}</th><th>${tr("slot_lunch")}</th><th>${tr("slot_dinner")}</th><th>${tr("slot_snack")}</th><th>kcal</th></tr></thead>
      <tbody>${rotRows}</tbody>
    </table></div>`;

  const formulaText = plan.formula === "katch" ? tr("formula_katch") : tr("formula_mifflin");
  const deltaTxt = `${G.delta >= 0 ? "+" : "−"}${Math.abs(G.delta * 100)}%`;
  const why = tr("why_text", { formula: formulaText, mult: plan.mult.toFixed(2), delta: deltaTxt, pg: G.pg });

  out.innerHTML = `
    <div class="hero">
      <h2>${L(LIFE[plan.life].name)} · ${L(G.name)}</h2>
      <p>${L(EXP[plan.exp].name)} · ${plan.days}×/${lang === "zh" ? "周" : "wk"} · ${plan.sex === "m" ? tr("male") : tr("female")} · ${plan.age} · ${plan.height} cm · ${plan.weight} kg${plan.bf ? " · " + plan.bf + "%" : ""}</p>
      <p style="margin-top:10px;color:#c3cdc9">${L(G.tip)}</p>
    </div>

    <h2 style="font-size:12px;letter-spacing:.14em;color:#8ea29b;text-transform:uppercase;margin:18px 4px 0;font-weight:500">${tr("summary")}</h2>
    ${stats}
    <section class="block" style="margin-top:4px"><h2>${tr("warn_title")}</h2>${warnHtml}
      <p class="list-note" style="margin-top:8px"><b>${tr("why")}</b>:${why}</p>
    </section>

    <section class="block"><h2><span class="no">${tr("train_no")}</span>${tr("train")}</h2>
      <p class="lede">${tr("week_n", { n: week })} · ${tr("week_desc")[week - 1]}</p>
      <div class="tabs">${weekTabs}</div>
      <div class="week">${dayCells}</div>
      ${progression}
      ${cardioNote}
    </section>

    <section class="block"><h2><span class="no">${tr("nutr_no")}</span>${tr("nutr")}</h2>
      <p class="lede">${L(LIFE[plan.life].name)} · ${tr("s_kcal")} ${r0(plan.kcal)} kcal · ${tr("s_protein")} ${r0(plan.protein)} g · ${tr("s_carb")} ${r0(plan.carbs)} g · ${tr("s_fat")} ${r0(plan.fat)} g</p>
      <h3 style="font-size:13px;margin:12px 0 6px">${tr("sample_day")}</h3>
      ${sampleTable}
      <h3 style="font-size:13px;margin:18px 0 6px">${tr("rotation")}</h3>
      ${rotTable}
      <h3 style="font-size:13px;margin:18px 0 6px">${tr("tips_life")}</h3>
      <ul class="tips">${LIFE[plan.life].tips[lang].map(t => `<li>${t}</li>`).join("")}</ul>
      <h3 style="font-size:13px;margin:18px 0 6px">${tr("tips_goal")}</h3>
      <ul class="tips"><li>${L(G.tip)}</li></ul>
    </section>

    <p class="foot">${tr("foot")}</p>
    <p class="foot">${tr("fine")}</p>`;

  out.querySelectorAll("[data-week]").forEach(b => b.addEventListener("click", () => {
    week = Number(b.dataset.week);
    render();
  }));
}

/* =====================================================================
 *  事件绑定
 * ===================================================================== */
$("#langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  applyStaticI18n();
  render();
});
$("#form").addEventListener("input", (e) => {
  if (e.target.id === "f_exp") $("#f_days").value = DAYS_DEFAULT[$("#f_exp").value];
  render();
});
$("#form").addEventListener("change", render);

applyStaticI18n();
$("#f_exp").value = DEF.f_exp;
$("#f_days").value = DAYS_DEFAULT[DEF.f_exp];
render();
</script>
